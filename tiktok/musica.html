<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Cápsula · Modo música</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Lienzo vertical 1080×1920 (TikTok Live), mismos colores que la escena vinilo:
     noche azul-negra, naranja encendido y crema.
     Incluye al perrito DJ (avatar.html), que aparece cada 5 minutos: ?cada=N  ?sonido=0 */
  :root {
    --noche: #07090f;
    --noche-2: #0f1420;
    --naranja: #ff7a1a;
    --naranja-osc: #d9520b;
    --ambar: #ffb05c;
    --crema: #f1e3c8;
    --crema-2: #c9b796;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent; /* deja ver la cámara del estudio que va debajo en OBS */
  }
  #lienzo {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    transform-origin: 0 0;
    font-family: "Inter", system-ui, "Segoe UI", sans-serif;
    color: var(--crema);
  }

  /* Velo: muy leve arriba (se ve bien a la gente) y más oscuro abajo, detrás de las tarjetas.
     El desenfoque de la cámara se pone en OBS (ver nota). */
  .velo {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(7, 9, 15, 0) 40%, rgba(7, 9, 15, 0.45) 100%),
      linear-gradient(180deg, rgba(7, 9, 15, 0.35) 0%, rgba(7, 9, 15, 0.08) 18%, rgba(7, 9, 15, 0.08) 70%, rgba(7, 9, 15, 0.6) 82%, rgba(7, 9, 15, 0.8) 100%);
  }

  /* Marco de neón alrededor de todo, con esquinas más brillantes. */
  .marco {
    position: absolute;
    inset: 22px;
    border-radius: 46px;
    border: 3px solid rgba(255, 122, 26, 0.55);
    box-shadow: 0 0 22px rgba(255, 122, 26, 0.55), inset 0 0 22px rgba(255, 122, 26, 0.25);
    animation: respirar 4s ease-in-out infinite;
  }
  @keyframes respirar {
    0%, 100% { border-color: rgba(255, 122, 26, 0.5); }
    50% { border-color: rgba(255, 176, 92, 0.85); }
  }
  .esquina {
    position: absolute;
    width: 200px;
    height: 200px;
    border: 6px solid var(--ambar);
    filter: drop-shadow(0 0 10px var(--naranja)) drop-shadow(0 0 22px var(--naranja));
  }
  .esquina.si { top: 22px; left: 22px; border-right: 0; border-bottom: 0; border-top-left-radius: 46px; }
  .esquina.sd { top: 22px; right: 22px; border-left: 0; border-bottom: 0; border-top-right-radius: 46px; }
  .esquina.ii { bottom: 22px; left: 22px; border-right: 0; border-top: 0; border-bottom-left-radius: 46px; }
  .esquina.id { bottom: 22px; right: 22px; border-left: 0; border-top: 0; border-bottom-right-radius: 46px; }

  /* Logo arriba */
  .logo {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 16px 46px 18px 50px;
    border-radius: 999px;
    border: 3px solid var(--naranja);
    background: rgba(7, 9, 15, 0.72);
    box-shadow: 0 0 24px rgba(255, 122, 26, 0.6), inset 0 0 18px rgba(255, 122, 26, 0.18);
    font-family: "Oswald", sans-serif;
    text-align: center;
    white-space: nowrap;
  }
  /* padding-left = letter-spacing, para que "RADIO" quede centrado sobre "CÁPSULA" */
  .logo .radio { font-size: 30px; letter-spacing: 12px; padding-left: 12px; font-weight: 600; line-height: 1; margin-bottom: 6px; }
  .logo .capsula {
    font-size: 70px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--crema) 0%, var(--crema) 45%, var(--ambar) 65%, var(--naranja) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .logo svg { width: 64px; height: 74px; color: var(--naranja); filter: drop-shadow(0 0 8px var(--naranja)); }
  .vivo {
    position: absolute;
    top: 232px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 30px 8px 32px; /* compensa el espacio que deja letter-spacing al final */
    border-radius: 999px;
    border: 2px solid var(--naranja);
    background: rgba(7, 9, 15, 0.8);
    box-shadow: 0 0 16px rgba(255, 122, 26, 0.5);
    font-family: "Oswald", sans-serif;
    font-size: 32px;
    letter-spacing: 4px;
  }
  .vivo i {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ff3b2f;
    box-shadow: 0 0 12px #ff3b2f;
    animation: parpadeo 1.2s ease-in-out infinite;
  }
  @keyframes parpadeo { 50% { opacity: 0.25; box-shadow: none; } }

  /* Ecualizadores a los costados: barras horizontales que salen del borde. */
  .eq {
    position: absolute;
    top: 590px;
    height: 640px;
    width: 70px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    filter: drop-shadow(0 0 6px rgba(255, 122, 26, 0.9));
  }
  .eq.izq { left: 30px; align-items: flex-start; }
  .eq.der { right: 30px; align-items: flex-end; }
  .eq span {
    height: 5px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--naranja-osc), var(--ambar));
    animation: estirar 1s ease-in-out infinite alternate;
  }
  .eq.izq span { transform-origin: left center; }
  .eq.der span { transform-origin: right center; background: linear-gradient(270deg, var(--naranja-osc), var(--ambar)); }
  @keyframes estirar { from { transform: scaleX(0.2); } to { transform: scaleX(1); } }

  /* Bloque inferior */
  .abajo {
    position: absolute;
    left: 86px;
    right: 86px;
    top: 1530px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .modo {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 8px 34px;
    border-radius: 999px;
    border: 2px solid var(--naranja);
    background: var(--noche);
    box-shadow: 0 0 16px rgba(255, 122, 26, 0.55);
    font-family: "Oswald", sans-serif;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 4px;
  }
  .modo svg { width: 32px; height: 32px; color: var(--naranja); }
  .tarjeta {
    box-sizing: border-box;
    width: 100%;
    border: 2px solid rgba(255, 122, 26, 0.6);
    border-radius: 30px;
    background: linear-gradient(160deg, rgba(20, 24, 36, 0.88), rgba(8, 10, 16, 0.92));
    box-shadow: 0 0 26px rgba(255, 122, 26, 0.3), inset 0 0 22px rgba(255, 122, 26, 0.08);
  }
  .perrito {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
    border: 0;
    background: transparent;
    z-index: 10;
  }
  .gracias-fila { display: flex; align-items: center; gap: 22px; margin-top: 28px; }
  .rayos { width: 48px; height: 60px; color: var(--naranja); filter: drop-shadow(0 0 6px var(--naranja)); }
  .rayos.der { transform: scaleX(-1); }
  .gracias {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 20px 38px;
    border-radius: 22px;
    font-size: 32px;
    font-weight: 600;
    white-space: nowrap;
  }
  .gracias .ico { width: 44px; height: 44px; flex: none; }
  .gracias .enviar { color: var(--naranja); }
  .gracias .corazon { color: var(--ambar); animation: titilar 1.6s ease-in-out infinite; }
  /* El corazón late: crece un poco y brilla, luego se apaga. */
  @keyframes titilar {
    0%, 100% { transform: scale(1); opacity: 0.55; filter: none; }
    15% { transform: scale(1.18); opacity: 1; filter: drop-shadow(0 0 10px #ffb05c); }
    30% { transform: scale(1); opacity: 0.8; }
    45% { transform: scale(1.12); opacity: 1; filter: drop-shadow(0 0 8px #ff7a1a); }
  }
</style>
</head>
<body>
<div id="lienzo">
  <div class="velo"></div>
  <div class="marco"></div>
  <div class="esquina si"></div><div class="esquina sd"></div>
  <div class="esquina ii"></div><div class="esquina id"></div>

  <div class="logo">
    <div>
      <div class="radio">RADIO</div>
      <div class="capsula">CÁPSULA</div>
    </div>
    <svg viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <rect x="7" y="1.5" width="10" height="16" rx="5"/>
      <path d="M10 6h4M10 9h4M10 12h4"/>
      <path d="M3.5 13a8.5 8.5 0 0 0 17 0M12 21.5V26M8 26h8"/>
    </svg>
  </div>
  <div class="vivo"><i></i>EN VIVO</div>

  <div class="eq izq" id="eq-izq"></div>
  <div class="eq der" id="eq-der"></div>

  <div class="abajo">
    <span class="modo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
        <path d="M4 15v-3a8 8 0 0 1 16 0v3"/>
        <rect x="3" y="14" width="4" height="7" rx="1.5" fill="currentColor"/>
        <rect x="17" y="14" width="4" height="7" rx="1.5" fill="currentColor"/>
      </svg>
      MODO MÚSICA
    </span>

    <div class="gracias-fila">
      <svg class="rayos" viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M14 5l6-3M8 15h14M14 25l6 3"/>
      </svg>
      <div class="tarjeta gracias">
        <svg class="ico enviar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
        <span>Pedila y que suene.</span>
        <svg class="ico corazon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>
        </svg>
      </div>
      <svg class="rayos der" viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M14 5l6-3M8 15h14M14 25l6 3"/>
      </svg>
    </div>
  </div>

  <!-- Perrito DJ 3D: aparece encima de todo cada 5 minutos (fondo transparente el resto del tiempo) -->
  <iframe class="perrito" id="perrito" title="Perrito DJ" scrolling="no" allow="autoplay"></iframe>
</div>
<script>
  const p = new URLSearchParams(location.search);

  // El perrito DJ recibe las mismas opciones de la URL (?cada=5, ?sonido=0).
  const opciones = new URLSearchParams();
  for (const k of ['cada', 'sonido']) if (p.get(k)) opciones.set(k, p.get(k));
  document.getElementById('perrito').src = 'avatar.html' + (opciones.toString() ? '?' + opciones : '');

  // Ecualizadores: más largos en el centro, cada barra con su ritmo.
  for (const id of ['eq-izq', 'eq-der']) {
    const eq = document.getElementById(id);
    const n = 40;
    for (let i = 0; i < n; i++) {
      const b = document.createElement('span');
      const centro = 1 - Math.abs(i - (n - 1) / 2) / (n / 2);
      b.style.width = Math.round(14 + centro * 56 * (0.5 + Math.random() * 0.5)) + 'px';
      b.style.animationDuration = (0.4 + Math.random() * 0.7).toFixed(2) + 's';
      b.style.animationDelay = (-Math.random()).toFixed(2) + 's';
      eq.appendChild(b);
    }
  }

  // Escala el lienzo 1080×1920 para que entre completo en la ventana y lo centra.
  const lienzo = document.getElementById('lienzo');
  function ajustar() {
    const s = Math.min(innerWidth / 1080, innerHeight / 1920);
    lienzo.style.transform = 'scale(' + s + ')';
    lienzo.style.left = (innerWidth - 1080 * s) / 2 + 'px';
    lienzo.style.top = (innerHeight - 1920 * s) / 2 + 'px';
  }
  addEventListener('resize', ajustar);
  ajustar();
</script>
</body>
</html>
