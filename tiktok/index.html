<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Cápsula · Escena vinilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Lienzo vertical 1080×1920 (TikTok Live). Colores de la marca Radio Cápsula:
     noche azul-negra, naranja encendido y crema. */
  :root {
    --noche: #07090f;
    --noche-2: #0f1420;
    --naranja: #ff7a1a;
    --naranja-osc: #d9520b;
    --ambar: #ffb05c;
    --crema: #f1e3c8;
    --crema-2: #c9b796;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent; /* deja ver la cámara del estudio que va debajo en OBS */
  }
  /* El diseño mide 1080×1920 y se escala para llenar la fuente, tenga el tamaño que tenga
     (TikTok LIVE Studio u OBS pueden crear la fuente más chica). */
  #lienzo {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    transform-origin: 0 0;
  }

  /* Fondo: velo oscuro y cálido semitransparente, para que la gente del estudio
     se vea a medias detrás. El desenfoque de la cámara se pone en OBS (ver nota). */
  .fondo {
    position: absolute;
    inset: -80px;
    opacity: 0.55;
    background:
      radial-gradient(circle at 20% 62%, rgba(255, 122, 26, 0.45) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(217, 82, 11, 0.35) 0%, transparent 45%),
      radial-gradient(circle at 75% 12%, rgba(241, 227, 200, 0.18) 0%, transparent 30%),
      linear-gradient(180deg, #0b1220 0%, var(--noche) 70%);
    filter: blur(18px) brightness(0.75);
  }
  .fondo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 60%, rgba(7, 9, 15, 0) 0%, rgba(7, 9, 15, 0.8) 100%);
  }

  /* Vinilo: a la izquierda, medio cortado por el borde. */
  .vinilo {
    position: absolute;
    width: 600px;
    height: 600px;
    left: -120px; /* medio cortado por el borde izquierdo */
    top: 910px; /* abajo, rozando el borde inferior de la zona segura (y = 1520) */
    z-index: 2; /* por encima de los cuadros */
    border-radius: 50%;
    background:
      conic-gradient(from 200deg,
        transparent 0deg,
        rgba(255, 122, 26, 0.32) 40deg,
        transparent 90deg,
        rgba(255, 176, 92, 0.22) 150deg,
        transparent 200deg,
        rgba(217, 82, 11, 0.3) 260deg,
        transparent 320deg),
      #0b0d14;
    box-shadow:
      0 0 0 3px rgba(255, 122, 26, 0.5),
      0 0 60px 6px rgba(255, 122, 26, 0.45);
  }
  .vinilo svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  /* Reflejo fijo de la luz sobre el disco (no gira, como en uno real). */
  .reflejo {
    position: absolute;
    width: 600px;
    height: 600px;
    left: -120px;
    top: 910px;
    z-index: 2;
    border-radius: 50%;
    background:
      conic-gradient(from 300deg,
        transparent 0deg, rgba(255, 240, 220, 0.16) 18deg, transparent 40deg,
        transparent 180deg, rgba(255, 240, 220, 0.10) 198deg, transparent 220deg),
      radial-gradient(circle, transparent 36%, rgba(0, 0, 0, 0.35) 100%);
    pointer-events: none;
  }
  /* Todo el disco gira sin parar (~33 RPM) mientras el borde late. */
  .vinilo {
    animation: girar 1.8s linear infinite, pulso 3s ease-in-out infinite;
    will-change: transform;
  }
  /* Brazo del tocadiscos con la aguja apoyada en los surcos (no gira). */
  .brazo {
    position: absolute;
    left: -61px;
    top: 52px; /* sigue al vinilo */
    z-index: 3;
    width: 1080px;
    overflow: visible;
    height: 1920px;
    transform-origin: -120px 640px; /* el pivote, fuera de pantalla */
    animation: vaiven 4s ease-in-out infinite;
    filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.6));
  }
  @keyframes vaiven {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-0.8deg); }
  }
  /* Columna derecha: onda + paneles, al lado del vinilo. */
  .columna {
    position: absolute;
    left: 450px; /* el borde izquierdo sale por debajo del vinilo */
    z-index: 1;
    top: 610px; /* más arriba para que el chat de TikTok no tape los cuadros */
    width: 600px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    font-family: "Inter", system-ui, "Segoe UI", sans-serif;
    color: var(--crema);
  }

  /* Onda de audio como la del logo: línea punteada con barras que laten desde el centro. */
  .onda {
    position: relative;
    height: 150px;
    width: 500px;
    margin: 0 auto; /* centrada sobre los paneles */
    display: flex;
    align-items: center;
    gap: 5px;
    filter: drop-shadow(0 0 8px rgba(255, 122, 26, 0.9));
  }
  .onda::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    border-top: 2px dotted rgba(255, 122, 26, 0.7);
  }
  .onda span {
    position: relative;
    flex: 1;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--ambar), var(--naranja) 50%, var(--naranja-osc));
    animation: latir 1s ease-in-out infinite alternate;
  }
  @keyframes latir { from { transform: scaleY(0.15); } to { transform: scaleY(1); } }

  .panel {
    box-sizing: border-box;
    padding: 30px 34px 30px 70px; /* deja espacio para el borde del vinilo */
    border: 2px solid rgba(255, 122, 26, 0.55);
    border-radius: 24px;
    background: linear-gradient(160deg, rgba(20, 24, 36, 0.9), rgba(8, 10, 16, 0.9));
    box-shadow: 0 0 26px rgba(255, 122, 26, 0.28), inset 0 0 22px rgba(255, 122, 26, 0.08);
  }
  .etiqueta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 22px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--naranja-osc), var(--naranja));
    color: #1a0d04;
    font-family: "Oswald", sans-serif;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 4px;
    box-shadow: 0 0 18px rgba(255, 122, 26, 0.65);
  }
  .etiqueta svg { width: 28px; height: 28px; }
  .titulo {
    font-family: "Oswald", sans-serif;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 16px;
    line-height: 1.05;
    color: var(--crema);
    text-transform: uppercase;
  }
  .subtitulo {
    font-family: "Oswald", sans-serif;
    font-size: 40px;
    font-weight: 400;
    letter-spacing: 3px;
    color: var(--naranja);
    line-height: 1.3;
    text-transform: uppercase;
  }
  .linea { margin-top: 24px; height: 5px; border-radius: 3px; background: rgba(241, 227, 200, 0.12); overflow: hidden; }
  .linea div {
    height: 100%;
    width: 40%;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--naranja), var(--ambar));
    animation: recorrer 4s linear infinite;
  }
  @keyframes recorrer { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  /* Panel de mensaje: avión, texto centrado, corazón. */
  .fila {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 24px 28px 24px 100px;
    margin-left: -70px; /* aquí el disco es más angosto: se estira para entrar por debajo */
    font-size: 36px;
    font-weight: 600;
  }
  .fila .ico { width: 46px; height: 46px; flex: none; }
  .fila .enviar { color: var(--naranja); }
  .fila .corazon { color: var(--ambar); animation: titilar 1.6s ease-in-out infinite; }
  /* El corazón late: crece un poco y brilla, luego se apaga. */
  @keyframes titilar {
    0%, 100% { transform: scale(1); opacity: 0.55; filter: none; }
    15% { transform: scale(1.18); opacity: 1; filter: drop-shadow(0 0 10px #ffb05c); }
    30% { transform: scale(1); opacity: 0.8; }
    45% { transform: scale(1.12); opacity: 1; filter: drop-shadow(0 0 8px #ff7a1a); }
  }
  .fila .texto { flex: 1; text-align: center; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @keyframes pulso {
    0%, 100% { box-shadow: 0 0 0 3px rgba(255, 122, 26, 0.5), 0 0 60px 6px rgba(255, 122, 26, 0.4); }
    50% { box-shadow: 0 0 0 3px rgba(255, 176, 92, 0.75), 0 0 90px 14px rgba(255, 122, 26, 0.6); }
  }
</style>
</head>
<body>
<div id="lienzo">
  <div class="fondo"></div>

  <div class="vinilo">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <radialGradient id="etiqueta" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1a1f2e"/>
          <stop offset="100%" stop-color="#0b0e16"/>
        </radialGradient>
      </defs>

      <!-- Surcos -->
      <g id="surcos" fill="none" stroke="rgba(255,240,220,0.06)" stroke-width="0.4"></g>

      <!-- Etiqueta central -->
      <circle cx="100" cy="100" r="36" fill="url(#etiqueta)" stroke="#ff7a1a" stroke-width="0.9"/>
      <circle cx="100" cy="100" r="11" fill="#ff7a1a"/>
      <ellipse cx="100" cy="100" rx="26" ry="8" transform="rotate(-18 100 100)" fill="none" stroke="#f1e3c8" stroke-width="1.6"/>

      <!-- Texto en la etiqueta (gira con el disco) -->
      <path id="arco" d="M100 100 m-29 0 a29 29 0 1 1 58 0 a29 29 0 1 1 -58 0" fill="none"/>
      <text font-family="Oswald, sans-serif" font-size="5.4" font-weight="600" letter-spacing="1.6" fill="#f1e3c8">
        <textPath href="#arco">RADIO CÁPSULA · EN VIVO · 33⅓ RPM ·</textPath>
      </text>
      <circle cx="100" cy="100" r="5" fill="#0b0e16" stroke="#ffb05c" stroke-width="0.6"/>

      <!-- Agujero -->
      <circle cx="100" cy="100" r="2.2" fill="#000"/>
    </svg>
  </div>

  <div class="reflejo"></div>

  <!-- Columna derecha, al lado del vinilo -->
  <div class="columna">
    <div class="onda" id="onda"></div>

    <div class="panel">
      <span class="etiqueta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
          <path d="M4 15v-3a8 8 0 0 1 16 0v3"/>
          <rect x="3" y="14" width="4" height="7" rx="1.5" fill="currentColor"/>
          <rect x="17" y="14" width="4" height="7" rx="1.5" fill="currentColor"/>
        </svg>
        MODO MÚSICA
      </span>
      <div class="titulo">Tu canción,</div>
      <div class="subtitulo">nuestra señal.</div>
      <div class="linea"><div></div></div>
    </div>

    <div class="panel fila">
      <svg class="ico enviar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
      <span class="texto">Pedila y que suene.</span>
      <svg class="ico corazon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>
      </svg>
    </div>
  </div>

  <script>
    // Onda: barras más altas en el centro y más bajas en los extremos, cada una con su ritmo.
    const onda = document.getElementById('onda');
    const n = 44;
    for (let i = 0; i < n; i++) {
      const b = document.createElement('span');
      const centro = 1 - Math.abs(i - (n - 1) / 2) / (n / 2); // 0 en los bordes, 1 en el medio
      b.style.height = Math.round(20 + centro * 100 * (0.6 + Math.random() * 0.4)) + '%';
      b.style.animationDuration = (0.45 + Math.random() * 0.7).toFixed(2) + 's';
      b.style.animationDelay = (-Math.random()).toFixed(2) + 's';
      onda.appendChild(b);
    }
  </script>

  <svg class="brazo" viewBox="0 0 1080 1920" aria-hidden="true">
    <defs>
      <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f1e3c8"/>
        <stop offset="50%" stop-color="#a8987c"/>
        <stop offset="100%" stop-color="#5e5446"/>
      </linearGradient>
    </defs>
    <!-- Girado sobre el pivote para que la aguja quede más hacia el centro del disco -->
    <g transform="rotate(9 -120 640)">
    <!-- Brazo: entra por el borde izquierdo (el pivote queda fuera de pantalla) -->
    <path d="M-120 640 L330 860 Q368 880 392 912" fill="none" stroke="url(#metal)" stroke-width="12" stroke-linecap="round"/>
    <!-- Cápsula (headshell) con la aguja sobre los surcos -->
    <g transform="rotate(50 410 930)">
      <rect x="378" y="912" width="66" height="36" rx="6" fill="#1a1f2e" stroke="#f1e3c8" stroke-width="3"/>
      <rect x="402" y="948" width="16" height="12" fill="#ff7a1a"/>
    </g>
    </g>
  </svg>

  <script>
    // Dibuja los surcos del vinilo (radios del 38 al 97).
    const surcos = document.getElementById('surcos');
    for (let r = 38; r <= 97; r += 1.6) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', 100);
      c.setAttribute('cy', 100);
      c.setAttribute('r', r.toFixed(1));
      // Algunas pistas más marcadas, como separaciones entre canciones.
      if ([52, 66, 81].some((p) => Math.abs(r - p) < 0.8)) {
        c.setAttribute('stroke', 'rgba(255,122,26,0.28)');
        c.setAttribute('stroke-width', '1.2');
      }
      surcos.appendChild(c);
    }
  </script>
</div>
<script>
  // Escala el lienzo 1080×1920 para que entre completo en la ventana y lo centra.
  const lienzo = document.getElementById('lienzo');
  function ajustar() {
    const s = Math.min(innerWidth / 1080, innerHeight / 1920);
    lienzo.style.transform = 'scale(' + s + ')';
    lienzo.style.left = (innerWidth - 1080 * s) / 2 + 'px';
    lienzo.style.top = (innerHeight - 1920 * s) / 2 + 'px';
  }
  addEventListener('resize', ajustar);
  ajustar();
</script>
</body>
</html>
