<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Cápsula Insólita — 1 cámara</title>
<link rel="stylesheet" href="overlay-common.css">
</head>
<body>
<svg style="display:none">
  <symbol id="doodle-cat" viewBox="0 0 100 100"><g fill="none" stroke="#2b2b2b" stroke-width="2.5">
    <path d="M30 35 L20 15 L38 28 Z"/><path d="M70 35 L80 15 L62 28 Z"/>
    <ellipse cx="50" cy="55" rx="30" ry="28"/><circle cx="38" cy="50" r="5" fill="#2b2b2b"/><circle cx="62" cy="50" r="5" fill="#2b2b2b"/>
    <path d="M40 68 Q50 76 60 68"/><path d="M15 58 L35 60"/><path d="M15 65 L35 63"/><path d="M85 58 L65 60"/><path d="M85 65 L65 63"/>
  </g></symbol>
  <symbol id="doodle-monster" viewBox="0 0 100 100"><g fill="none" stroke="#2b2b2b" stroke-width="2.5">
    <ellipse cx="50" cy="45" rx="34" ry="30"/><circle cx="50" cy="42" r="14"/><circle cx="50" cy="42" r="5" fill="#2b2b2b"/>
    <path d="M50 15 L45 2 M50 15 L55 2"/><path d="M22 70 L18 90 M30 70 L28 92 M70 70 L74 90 M78 70 L82 92"/><path d="M30 60 Q50 72 70 60"/>
  </g></symbol>
  <symbol id="doodle-figure" viewBox="0 0 100 100"><g fill="none" stroke="#2b2b2b" stroke-width="2.5">
    <circle cx="50" cy="22" r="12"/><path d="M50 34 L50 65 M50 42 L30 55 M50 42 L70 55 M50 65 L35 90 M50 65 L65 90"/>
    <circle cx="78" cy="78" r="8"/><path d="M78 86 L74 94 M78 86 L82 94 M78 70 L72 66 M78 70 L84 66"/>
  </g></symbol>
</svg>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <mask id="wallmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <rect width="1920" height="1080" fill="white"/>
      <rect x="560" y="300" width="800" height="580" rx="26" fill="black"/>
    </mask>
  </defs>
</svg>
<div class="stage">
  <div class="bg-wall" style="mask:url(#wallmask); -webkit-mask:url(#wallmask);"></div>
  <div class="spotlight"></div>
  <div class="lamp flicker"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="glitch-layer r"></div>
  <div class="glitch-layer c"></div>

  <div class="title">LA CÁPSULA INSÓLITA<small>CASO ABIERTO · EN VIVO</small></div>

  <!-- doodles pegados -->
  <div class="sticky" style="top:140px; left:40px; width:150px; height:150px; transform: rotate(-6deg);">
    <svg viewBox="0 0 100 100"><use href="#doodle-cat"/></svg>
  </div>
  <div class="sticky" style="top:330px; left:70px; width:130px; height:130px; transform: rotate(4deg);">
    <svg viewBox="0 0 100 100"><use href="#doodle-figure"/></svg>
  </div>
  <div class="sticky" style="top:140px; right:40px; width:150px; height:150px; transform: rotate(5deg);">
    <svg viewBox="0 0 100 100"><use href="#doodle-monster"/></svg>
  </div>

  <!-- cinta inferior -->
  <div class="crime-tape" style="bottom:50px; left:-40px; width:900px; transform: rotate(-1.5deg);"><span>PRECAUCIÓN · NO CRUZAR</span></div>
  <div class="crime-tape" style="bottom:50px; right:-40px; width:900px; transform: rotate(1.5deg);"><span>LA CÁPSULA INSÓLITA</span></div>

  <!-- hueco de camara central, grande, estilo capsula -->
  <div class="cam-frame" style="top:300px; left:560px; width:800px; height:580px; border-radius:26px;">
    <div class="corner-tape tl"></div><div class="corner-tape tr"></div>
    <div class="corner-tape bl"></div><div class="corner-tape br"></div>
    <div class="cam-label">CÁMARA</div>
  </div>
</div>
</body>
</html>
